services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dealradar
      POSTGRES_PASSWORD: dealradar
      POSTGRES_DB: dealradar
    ports:
      - "15432:5432" # non-default host port; avoids local Postgres on 5432/5433
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealradar -d dealradar"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://dealradar:dealradar@postgres:5432/dealradar
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      backend:
        condition: service_healthy

  generator:
    build:
      context: ./generator
      dockerfile: Dockerfile
    environment:
      WEBHOOK_URL: http://backend:3001/webhook/events
      INTERVAL_MS: 2000
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - with-generator

volumes:
  postgres_data:
